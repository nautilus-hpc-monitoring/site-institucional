            <li class="nav-item">

        <div class="mobile-sidebar-bottom">
            <a href="#" class="nav-item">

        </div>
    </aside>

    <nav id="sidebar">
        <div id="sidebar_content">
            <div id="logo">
                <img src="./assets/img/logo.png" id="logo_sidebar" alt="">
                <p id="logo_infos">
                    <span class="item-description">NAUTILUS</span>
                </p>
            </div>

            <ul id="side_items">
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-border-all"></i>
                        <span class="item-description">Visão Geral</span>

                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-database"></i>

                    <a href="#">
                        <i class="fa-solid fa-chart-line"></i>

                    <a href="./dashboard-operador.html">

                <li class="side-item">

    <div id="main-container">
        <header class="top-header">
            <div class="user-profile">
                <div class="user-avatar">
                    <i class="fa-regular fa-user"></i>
                </div>
                <span class="user-name" id="b_usuario"></span>
            </div>
        </header>

        <main class="page-content">
            <!-- Ambientes HPC -->
            <div class="ambientes">
                <div class="area-filtro">
                    <h1>Buscar ambiente HPC</h1>
                    <input type="text" placeholder="Ambiente">
                </div>

                <div class="ambientes_hpc lista" id="ambientes_hpc">
                    <!-- Ambiente -->
                </div>
            </div>

            <!-- Clusters -->
            <div class="clusters none lista" id="clusters">

            </div>

            <!-- Nodes -->
            <div class="nodes none lista" id="nodes">

            </div>
        </main>
    </div>
</body>

<script>
    const htmlAmbientesHpc = document.getElementById("ambientes_hpc");
    const htmlClusters = document.getElementById("clusters");
    const htmlNodes = document.getElementById("nodes");
    const ambientes = [
        {
            id_ambiente_hpc: 1,
            nome: "Petrobrás 1",
            status: "ativo"
        },
        {
            id_ambiente_hpc: 2,
            nome: "Petrobrás 2",
            status: "manut"
        },
        {
            id_ambiente_hpc: 3,
            nome: "Petrobrás 3",
            status: "desativado"
        }
    ]

    ambientes.forEach(ambiente => {
        const statusExibir = (ambiente.status == "manut") ? "manutenção" : ambiente.status;
        htmlAmbientesHpc.innerHTML += `
            <div class="item" onclick="abrirClusters(${ambiente.id_ambiente_hpc})">
                <h2>${ambiente.nome}</h2>

                <div class="status ${ambiente.status}">
                    <p>${statusExibir}</p>
                </div>
            </div>
        `;
    });

    document.getElementById('open-sidebar-btn').onclick = function () {
        mobileSidebar.classList.add('active');
        document.getElementById('sidebar-overlay').classList.add('active');
    };

    document.getElementById('close-sidebar-btn').onclick = function () {
        mobileSidebar.classList.remove('active');
        document.getElementById('sidebar-overlay').classList.remove('active');
    };

    document.getElementById('sidebar-overlay').onclick = function () {
        mobileSidebar.classList.remove('active');
        document.getElementById('sidebar-overlay').classList.remove('active');
    };


    function abrirClusters(id_ambiente_hpc) {
        // id_ambiente_hpc vai ser utilizado para pesquisa no banco de dados
        const clusters = [
            {
                id_cluster: 1,
                nome: "cluster 1",
                status: "ativo"
            },
            {
                id_cluster: 2,
                nome: "cluster 2",
                status: "manut"
            },
            {
                id_cluster: 3,
                nome: "cluster 3",
                status: "desativado"
            }
        ]

        clusters.forEach(cluster => {
            const statusExibir = (cluster.status == "manut") ? "manutenção" : cluster.status;
            htmlClusters.innerHTML += `
                <div class="item" onclick="abrirNodes(${cluster.id_cluster})">
                    <h2>${cluster.nome}</h2>

                    <div class="status ${cluster.status}">
                        <p>${statusExibir}</p>
                    </div>
                </div>
            `;
        });

        htmlClusters.classList.toggle("none");
        htmlAmbientesHpc.classList.add("none");
    }

    function abrirNodes(id_cluster) {
        // id_cluster vai ser utilizado para pesquisa no banco de dados
        const nodes = [
            {
                id_node: 1,
                hostname: "Node 01",
                ip: "192.168.0.1",
                sistema_operacional: "Linux",
                status: "ativo"
            },
            {
                id_node: 2,
                hostname: "Node 02",
                ip: "192.168.0.2",
                sistema_operacional: "Linux",
                status: "manut"
            },
            {
                id_node: 3,
                hostname: "Node 03",
                ip: "192.168.0.3",
                sistema_operacional: "Linux",
                status: "desativado"
            }
        ];

        nodes.forEach(node => {
            const statusExibir = (node.status == "manut") ? "manutenção" : node.status;
            htmlNodes.innerHTML += `
                <div class="item">
                    <div class="item-titulo">
                        <h2>${node.hostname} ${node.sistema_operacional}</h2>
                        <p>${node.ip}</p>
                    </div>

                    <div class="status ${node.status}">
                        <p>${statusExibir}</p>
                    </div>
                </div>
            `;
        });

        htmlClusters.classList.add("none");
        htmlNodes.classList.toggle("none");
    }
</script>

</html>
