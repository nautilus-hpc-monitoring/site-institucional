<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/sidebar.css">
    <script src="./js/sessao.js"></script>
    <title>Nautilus - Cadastro Node</title>
    <link rel="icon" href="./assets/icon/logo.png">
</head>

<body>

    <div class="mobile-header">
        <button id="open-sidebar-btn" aria-label="Abrir menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <img src="./assets/img/logo.png" alt="Logo" class="mobile-header-logo">
    </div>

    <div id="sidebar-overlay"></div>

    <aside class="mobile-sidebar" id="mobileSidebar">
        <div class="mobile-sidebar-header">
            <div class="mobile-logo">
                <img src="./assets/img/logo.png" alt="Nautilus Logo">
                <span>NAUTILUS</span>
            </div>
            <button id="close-sidebar-btn" aria-label="Fechar menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <ul class="mobile-sidebar-items">
            <li class="nav-item">
                <a href="#"><i class="fa-solid fa-border-all"></i> <span>Visão Geral</span></a>
            </li>
            <li class="nav-item">
                <a href="#"><i class="fa-solid fa-database"></i> <span>Ambientes</span></a>
            </li>
            <li class="nav-item">
                <a href="#"><i class="fa-solid fa-chart-line"></i> <span>Clusters</span></a>
            </li>
            <li class="nav-item active">
                <a href="./cadastro-node.html"><i class="fa-solid fa-memory"></i> <span>Nodes</span></a>
            </li>
            <li class="nav-item">
                <a href="./dashboard-operador.html"><i class="fa-solid fa-chart-line"></i> <span>Dashboard</span></a>
            </li>
            <li class="nav-item">
                <a href="./cadastro-funcionario.html"><i class="fa-solid fa-users"></i> <span>Funcionários</span></a>
            </li>
            <li class="nav-item">
                <a href="./cadastro-empresa.html"><i class="fa-solid fa-building"></i> <span>Empresas</span></a>
            </li>
        </ul>

        <div class="mobile-sidebar-bottom">
            <a href="#" class="nav-item">
                <i class="fa-solid fa-sliders"></i>
                <span>Configurações</span>
            </a>
            <a href="#" class="nav-item" onclick="encerrarSessao()">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Sair</span>
            </a>
        </div>
    </aside>

    <nav id="sidebar">
        <div id="sidebar_content">
            <div id="logo">
                <img src="./assets/img/logo.png" id="logo_sidebar" alt="">
                <p id="logo_infos">
                    <span class="item-description">NAUTILUS</span>
                </p>
            </div>

            <ul id="side_items">
                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-border-all"></i>
                        <span class="item-description">Visão Geral</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-database"></i>
                        <span class="item-description">Ambientes</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="#">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="item-description">Clusters</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="./cadastro-node.html">
                        <i class="fa-solid fa-memory"></i>
                        <span class="item-description">Nodes</span>
                    </a>
                </li>

                <li class="side-item active">
                    <a href="./dashboard-operador.html">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="item-description">Dashboard</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="./cadastro-funcionario.html">
                        <i class="fa-solid fa-users"></i>
                        <span class="item-description">Funcionários</span>
                    </a>
                </li>

                <li class="side-item">
                    <a href="./cadastro-empresa.html">
                        <i class="fa-solid fa-building"></i>
                        <span class="item-description">Empresas</span>
                    </a>
                </li>
            </ul>
        </div>


        <ul id="side_bottom">
            <li class="side-item">
                <a href="#">
                    <i class="fa-solid fa-sliders"></i>
                    <span class="item-description">Configurações</span>
                </a>
            </li>
            <li class="side-item">
                <a href="#" onclick="encerrarSessao()">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span class="item-description">Sair</span>
                </a>
            </li>
        </ul>
    </nav>



</body>
<script>
    document.getElementById('open-sidebar-btn').onclick = function () {
        mobileSidebar.classList.add('active');
        document.getElementById('sidebar-overlay').classList.add('active');
    };

    document.getElementById('close-sidebar-btn').onclick = function () {
        mobileSidebar.classList.remove('active');
        document.getElementById('sidebar-overlay').classList.remove('active');
    };

    document.getElementById('sidebar-overlay').onclick = function () {
        mobileSidebar.classList.remove('active');
        document.getElementById('sidebar-overlay').classList.remove('active');
    };

</script>

</html>
