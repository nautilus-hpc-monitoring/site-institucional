<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>Nautilus - Cadastro</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/cadastro.css">
    <link rel="stylesheet" href="./css/global.css">

    <script src="./js/navbar.js" defer></script>
    <link rel="icon" href="./assets/icon/logo.png">
</head>

<body class="body-formulario">

    <header class="navbar">
        <div class="navbar_container">

            <div class="navbar_left">

                <button class="navbar_menu" id="btnMenu" aria-label="Abrir menu">
                    ☰
                </button>

                <a href="./index.html" class="navbar_logo">
                    <img src="./assets/img/logo.png" alt="Nautilus Logo">
                    Nautilus
                </a>

                <nav class="navbar_nav">
                    <a href="./pagina-solucao.html">
                        Serviço como solução
                        <span class="navbar_setas">
                            <img src="./assets/icon/seta_direita_azul_qd.svg" alt="" class="seta_normal">
                            <img src="./assets/icon/seta_direita_azul_claro_qd.svg" alt="" class="seta_hover">
                        </span>
                    </a>

                    <a href="./sobre-nos.html">
                        Sobre nós
                        <span class="navbar_setas">
                            <img src="./assets/icon/seta_direita_azul_qd.svg" alt="" class="seta_normal">
                            <img src="./assets/icon/seta_direita_azul_claro_qd.svg" alt="" class="seta_hover">
                        </span>
                    </a>

                </nav>

            </div>

            <div class="navbar_actions">
                <button><a href="./login.html">Login</a></button>
            </div>

        </div>
    </header>

    <aside class="sidebar" id="sidebar">

        <div class="sidebar_topo">
            <a href="./index.html" class="sidebar_logo">
                <img src="./assets/img/logo.png" alt="Nautilus Logo">
                Nautilus
            </a>

            <button class="sidebar_fechar" id="btnFechar">
                ✕
            </button>
        </div>

        <nav class="sidebar_nav">

            <a href="./pagina-solucao.html">
                <span>Serviço como solução</span>

                <span class="sidebar_setas">
                    <img src="./assets/icon/seta_direita_azul_qd.svg" alt="" class="seta_normal">
                    <img src="./assets/icon/seta_direita_azul_claro_qd.svg" alt="" class="seta_hover">
                </span>
            </a>

            <a href="./sobre-nos.html">
                <span>Sobre nós</span>

                <span class="sidebar_setas">
                    <img src="./assets/icon/seta_direita_azul_qd.svg" alt="" class="seta_normal">
                    <img src="./assets/icon/seta_direita_azul_claro_qd.svg" alt="" class="seta_hover">
                </span>
            </a>

        </nav>

        <div class="sidebar_actions">
            <button><a href="./login.html">Login</a></button>
        </div>

    </aside>

    <div class="cadastro">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container-cadastro">
            <div class="card">
                <div class="inicio-cadastro">
                    <img src="assets/imgs/Group 36.png" alt="">
                    <h2>Crie sua conta na NAUTILUS</h2>
                    <h3>Cadastre-se para acessar a plataforma de monitoramento de
                        alta performance.</h3>
                </div>

                <div class="formulario">
                    <div class="campo">
                        <input id="nome_input" type="text" placeholder="Nome Completo" />
                    </div>
                    <div class="campo">
                        <input id="cpf_input" type="text" placeholder="CPF" />
                    </div>
                    <div class="campo">
                        <input id="email_input" type="text" placeholder="Email" />
                    </div>
                    <div class="campo">
                        <input id="senha_input" type="password" placeholder="Senha" />
                    </div>
                    <div class="campo">
                        <input id="confirmacao_senha_input" type="password" placeholder="Confirmar Senha" />
                    </div>
                    <button class="botao" onclick="cadastrar()">Cadastrar</button>
                    <div id="div_aguardar">
                    </div>
                </div>
            </div>
            <div class="imagem-login">
                <img src="assets/imgs/img.png" class="img-grade" alt="">
                <div class="textos-login">
                    <h1>Alta performance<br>começa com<br>visão.</h1>

                    <div class="linha-login"></div>

                    <p>
                        Monitoramento inteligente<br>
                        para ambientes de<br>
                        computação de alto<br>
                        desempenho.
                    </p>
                </div>
                <img src="assets/imgs/Group 30.png" class="img-circulo" alt="">
            </div>
        </div>
    </div>
    <div id="div_erros_login"></div>

</body>

</html>

<script>
    function cadastrar() {
        var nomeVar = nome_input.value;
        var cpfVar = cpf_input.value;
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;
        var confirmacaoSenhaVar = confirmacao_senha_input.value;

        if (nomeVar == "" || cpfVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Preencha todos os campos para prosseguir.";
            return false;
        }

        if (senhaVar != confirmacaoSenhaVar) {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "As senhas inseridas não coincidem.";
            return false;
        } else {
            setInterval(sumirMensagem, 5000);
        }

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar,
                cpfServer: cpfVar
            })
        }).then(function (resposta) {

            if (resposta.ok) {
                setTimeout(function () {
                    window.location = "./login.html";
                }, 1000);

            } else {
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }
</script>
