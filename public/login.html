<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nautilus - Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/navbar.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="stylesheet" href="./css/global.css">

    <script src="./js/navbar.js" defer></script>
    <link rel="icon" href="./assets/icon/logo.png">
</head>

<body class="body-formulario">

    <header class="navbar">
        <div class="navbar_container">

            <div class="navbar_left">

                <a href="./index.html" class="navbar_logo">
                    <img src="./assets/img/logo.png" alt="Nautilus Logo">
                    Nautilus
                </a>

            </div>

            <div class="navbar_actions">
                <a href="./cadastro.html">
                <button>Cadastre-se</button>
                </a>
            </div>

        </div>
    </header>

    <aside class="sidebar" id="sidebar">

        <div class="sidebar_topo">
            <a href="./index.html" class="sidebar_logo">
                <img src="./assets/img/logo.png" alt="Nautilus Logo">
                Nautilus
            </a>

            <button class="sidebar_fechar" id="btnFechar">
                ✕
            </button>
        </div>

        <nav class="sidebar_nav">

            <a href="./pagina-solucao.html">
                <span>Serviço como solução</span>

                <span class="sidebar_setas">
                    <img src="./assets/icon/seta_direita_azul_qd.svg" alt="" class="seta_normal">
                    <img src="./assets/icon/seta_direita_azul_claro_qd.svg" alt="" class="seta_hover">
                </span>
            </a>

            <a href="./sobre-nos.html">
                <span>Sobre nós</span>

                <span class="sidebar_setas">
                    <img src="./assets/icon/seta_direita_azul_qd.svg" alt="" class="seta_normal">
                    <img src="./assets/icon/seta_direita_azul_claro_qd.svg" alt="" class="seta_hover">
                </span>
            </a>


        </nav>

        <div class="sidebar_actions">
            <button><a href="./login.html">Login</a></button>
        </div>

    </aside>

    <div class="cadastro">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container-cadastro">
            <div class="card">
                <div class="inicio-cadastro">
                    <img src="assets/imgs/Group 36.png" alt="">
                    <h2>Bem-vindo à NAUTILUS</h2>
                    <h3>Acesse sua plataforma de monitoramento de
                        alta performance.</h3>
                </div>

                <div class="formulario">

                    <div class="campo">
                        <input id="email_input" type="text" placeholder="Email" />
                    </div>
                    <div class="campo">
                        <input id="senha_input" type="password" placeholder="Senha" />
                    </div>
                    <button class="botao" onclick="entrar()">Login</button>
                    <div id="div_aguardar">
                    </div>
                </div>
                <div id="div_erros_login"></div>
            </div>
            <div class="imagem-login">
                <img src="assets/imgs/img.png" class="img-grade" alt="">
                <div class="textos-login">
                    <h1>Alta performance<br>começa com<br>visão.</h1>

                    <div class="linha-login"></div>

                    <p>
                        Monitoramento inteligente<br>
                        para ambientes de<br>
                        computação de alto<br>
                        desempenho.
                    </p>
                </div>
                <img src="assets/imgs/Group 30.png" class="img-circulo" alt="">
            </div>
        </div>
    </div>
    

</body>

</html>

<script src="js/login.js"></script>
